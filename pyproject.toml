[project]
name = "crm-data-quality"
version = "1.0.0"
description = "Audit, standardisation and deduplication of a multi-subsidiary CRM"
authors = [{ name = "Ferial Louni" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "rapidfuzz>=3.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
